# M3.1 巡逻路径点配置
# 坐标系: map (参考 office.yaml: origin=[-5.0, -5.0, 0.0], 10m×10m)
# yaw 单位为弧度, 使用右手定则 (绕 Z 轴)

# 巡逻点（至少 3 个，构成闭环路径）
# 从 (2,2) 出发 → (4,4) → (6,2) → (4,0) → 返回 (2,2)
patrol_points:
  - {x: 2.0, y: 2.0, yaw: 1.57}
  - {x: 4.0, y: 4.0, yaw: 3.14}
  - {x: 6.0, y: 2.0, yaw: -1.57}
  - {x: 4.0, y: 0.0, yaw: 0.0}
  - {x: 2.0, y: 2.0, yaw: 0.0}

# 充电预备点（充电桩前方 0.5m 处，机器人转向充电桩）
charge_standby:
  x: 7.0
  y: 6.0
  yaw: -1.57

# 充电桩坐标（用于最终停靠对接）
charge_dock:
  x: 7.5
  y: 6.0
  yaw: -1.57

# 导航超时时间（秒），超过此时间认为堵赛
navigation_timeout: 60.0

# 到达每个巡逻点后的停留时间（秒）
waypoint_wait_duration: 3.0
